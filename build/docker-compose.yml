services:
  # Spec S3 entry surface. The web container is deliberately NOT published to
  # the host: 80/443 here are the only way in, so a player's first nmap sees
  # the corporate portal the story rests on rather than a bare dev port.
  # Local testing goes through this too -- override BASE_URL if you need to
  # hit Flask directly (see web/tests/integration_smoke.py).
  proxy:
    build: ./proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    networks:
      - dmz

  web:
    build: ./web
    restart: unless-stopped
    # No FLASK_SECRET_KEY here on purpose: a value pinned in this file is a
    # published secret, and the SSTI RCE (spec S5) hands a player the process
    # environment, so a constant key would let them forge an is_privileged
    # session instead of finding the LDAP injection. docker-entrypoint.sh
    # mints a random one per container start.
    environment:
      AD_VLAN_SUBNET: ${AD_VLAN_SUBNET:?set in network/config.env}
      INTERNAL_AD_SUBNET: ${INTERNAL_AD_SUBNET:?set in network/config.env}
      INTERNAL_AD_GATEWAY_IP: ${INTERNAL_AD_GATEWAY_IP:?set in network/config.env}
    # Gitignored; create with: cp web/.env.real-ldap.example web/.env.real-ldap
    env_file:
      - ./web/.env.real-ldap
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "dc01.donerup.htb:${DC_IP:?set in network/config.env}"
    networks:
      dmz: {}
      internal-ad:
        ipv4_address: ${WEB_INTERNAL_AD_IP:?set in network/config.env}

  legacy-auth-db:
    build: ./legacy-auth-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "DonerciKral99!"
      MYSQL_DATABASE: legacy_auth
    networks:
      - dmz

networks:
  dmz:
    name: dmz
    driver: bridge
  internal-ad:
    name: internal-ad
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${INTERNAL_AD_SUBNET:?set in network/config.env}
