services:
  web:
    build: ./web
    ports:
      - "8080:5000"
    environment:
      LDAP_MODE: mock
      FLASK_SECRET_KEY: dev-only-not-for-prod
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "dc01.donerup.htb:${DC_IP:?set in network/config.env}"
    networks:
      dmz: {}
      internal-ad:
        ipv4_address: ${WEB_INTERNAL_AD_IP:?set in network/config.env}

  legacy-auth-db:
    build: ./legacy-auth-db
    environment:
      MYSQL_ROOT_PASSWORD: "Summer2019!"
      MYSQL_DATABASE: legacy_auth
    networks:
      - dmz

networks:
  dmz:
    name: dmz
    driver: bridge
  internal-ad:
    name: internal-ad
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${INTERNAL_AD_SUBNET:?set in network/config.env}
