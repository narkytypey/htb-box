# Spec S3 entry surface: 80 redirects to 443, 443 is the real application.
# The Flask app itself is never published to the host -- reaching it means
# going through this proxy, so the port list a player sees during recon
# matches what the design promises.

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/donerup.crt;
    ssl_certificate_key /etc/nginx/certs/donerup.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The LDAP-injection and SSTI payloads carry full-width Unicode and are
    # submitted as form bodies; nothing here may rewrite or size-cap them,
    # or the intended chain breaks at the proxy instead of the app.
    client_max_body_size 1m;

    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
